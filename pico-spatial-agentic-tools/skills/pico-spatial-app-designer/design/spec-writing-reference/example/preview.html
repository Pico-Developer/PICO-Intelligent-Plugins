<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekend Reading List</title><link rel="stylesheet" href="../../design-reference/runtime/tokens.css"><script src="../../design-reference/runtime/components.js" defer></script><style>
html,body{margin:0;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}body{margin:0}*{box-sizing:border-box}
/* Reserve room for the companion window; window size is supplied by this page. */
#stage{width:1104px;position:relative}#main-window{width:720px;height:540px}
.title{font-weight:700}.header-copy{display:flex;flex-direction:column;gap:4px}#body{padding:0 32px 32px;display:flex;flex-direction:column;gap:16px;flex:1;min-height:0;overflow:auto}#book-list{display:flex;flex-direction:column;gap:8px}.cover{display:block;width:60px;height:80px;object-fit:cover;border-radius:6px}.row-copy{display:flex;flex-direction:column;gap:4px}.book-summary{margin-top:8px}.chosen{--unused:0}
#detail-content{width:360px;height:540px;display:flex;flex-direction:column}#detail-body{padding:0 32px 32px;display:flex;flex-direction:column;gap:16px;flex:1;min-height:0;overflow:auto}#detail-identity{display:flex;gap:16px;align-items:center}#detail-copy{display:flex;flex-direction:column;gap:4px;flex:1}#detail-cover{width:72px;height:96px;object-fit:cover;border-radius:6px}#detail-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:auto}
</style></head><body><sui-preview-stage><div id="stage"><sui-planar-window id="main-window" role="main" aria-label="Weekend Reading List"><sui-title-bar id="main-titlebar"><div id="header-copy" class="header-copy"><span id="main-title" class="title">Weekend Reading List</span><sui-text id="main-subtitle" text="Three books to enjoy at an unhurried pace" text-style="bodyMedium" color="var(--label-ultradark-alpha)"></sui-text></div><sui-button id="save" slot="trailing" size="small" text="Save List"></sui-button></sui-title-bar><div id="body"><sui-text id="intro" text="Essays, cities, and nature: set aside some weekend reading time." text-style="bodyMedium" color="var(--label-semidark-alpha)"></sui-text><div id="book-list"><sui-list-item id="row-slow" content-padding="16" custom-width="656" tabindex="0" role="button" aria-label="View details for The Unhurried Days"><img id="cover-slow" class="cover" slot="leading" src="assets/slow.svg" alt="Cover of The Unhurried Days"><div id="copy-slow" class="row-copy" slot="headline"><sui-text id="name-slow" text="The Unhurried Days" text-style="titleMedium"></sui-text><sui-text id="meta-slow" text="Lin Jian · Life essays · about 2 hours" text-style="bodySmall" color="var(--label-semidark-alpha)"></sui-text></div><sui-text id="summary-slow" slot="supporting" text="Find your own rhythm in everyday moments." text-style="bodyMedium" color="var(--label-semidark-alpha)"></sui-text></sui-list-item><sui-list-item id="row-city" content-padding="16" custom-width="656" tabindex="0" role="button" aria-label="View details for Another Side of the City"><img id="cover-city" class="cover" slot="leading" src="assets/city.svg" alt="Cover of Another Side of the City"><div id="copy-city" class="row-copy" slot="headline"><sui-text id="name-city" text="Another Side of the City" text-style="titleMedium"></sui-text><sui-text id="meta-city" text="Zhou Yuan · Urban observations · about 3 hours" text-style="bodySmall" color="var(--label-semidark-alpha)"></sui-text></div><sui-text id="summary-city" slot="supporting" text="Rediscover a familiar city along its streets and alleys." text-style="bodyMedium" color="var(--label-semidark-alpha)"></sui-text></sui-list-item><sui-list-item id="row-stars" content-padding="16" custom-width="656" tabindex="0" role="button" aria-label="View details for Letters to the Night Sky"><img id="cover-stars" class="cover" slot="leading" src="assets/stars.svg" alt="Cover of Letters to the Night Sky"><div id="copy-stars" class="row-copy" slot="headline"><sui-text id="name-stars" text="Letters to the Night Sky" text-style="titleMedium"></sui-text><sui-text id="meta-stars" text="Xu Xing · Nature reading · about 2.5 hours" text-style="bodySmall" color="var(--label-semidark-alpha)"></sui-text></div><sui-text id="summary-stars" slot="supporting" text="Experience nature at scale through starlight and seasons." text-style="bodyMedium" color="var(--label-semidark-alpha)"></sui-text></sui-list-item></div></div></sui-planar-window>
<sui-subwindow id="book-detail" for="main-window" placement="end" depth="0" custom-width="360" custom-height="540" content-padding="0" corner-radius="32" dismiss-on-click-outside="false" hidden><div id="detail-content"><sui-title-bar id="detail-titlebar"><sui-icon-button id="close-detail" slot="leading" size="small" semantic-label="Close book details"><sui-icon id="close-icon" name="ICON7-P239" size="16"></sui-icon></sui-icon-button><span id="detail-heading" class="title">Book Details</span></sui-title-bar><div id="detail-body"><div id="detail-identity"><img id="detail-cover" alt=""><div id="detail-copy"><sui-text id="detail-name" text-style="titleMedium"></sui-text><sui-text id="detail-author" text-style="bodyMedium" color="var(--label-semidark-alpha)"></sui-text></div></div><sui-text id="detail-label" text="Overview" text-style="titleSmall"></sui-text><sui-text id="detail-description" text-style="bodyMediumMultiline" color="var(--label-semidark-alpha)"></sui-text><div id="detail-actions"><sui-button id="read" text="Start Preview" size="regular"></sui-button></div></div></div></sui-subwindow></div></sui-preview-stage>
<script>const books=[{"id": "slow", "title": "The Unhurried Days", "author": "Lin Jian", "tag": "Life essays · about 2 hours", "summary": "Find your own rhythm in everyday moments.", "description": "A collection of short essays about walking, cooking, and solitude. Through ordinary details, the author explores how to make room for yourself. Ideal for a few pages on a weekend afternoon.", "excerpt": "That morning, I did not rush outside. Window light moved slowly across the table, and yesterday's unfinished book still waited on the same page.", "color": "#537c70"}, {"id": "city", "title": "Another Side of the City", "author": "Zhou Yuan", "tag": "Urban observations · about 3 hours", "summary": "Rediscover a familiar city along its streets and alleys.", "description": "From secondhand bookshops and morning markets to riverside paths and late-night stores, this book records overlooked city routines and the people within them.", "excerpt": "Past the familiar intersection and down a narrow alley, I heard the city waking for the first time.", "color": "#a57253"}, {"id": "stars", "title": "Letters to the Night Sky", "author": "Xu Xing", "tag": "Nature reading · about 2.5 hours", "summary": "Experience nature at scale through starlight and seasons.", "description": "Beginning with the first visible star, follow seasonal changes across the night sky. There are no complex formulas, only observations and curiosity that can start at your window.", "excerpt": "After the lights went out, the night did not darken at once. As my eyes adjusted, distant stars appeared one after another.", "color": "#586584"}];window.addEventListener('DOMContentLoaded',()=>{let selected=null,saved=false;const detail=document.getElementById('book-detail');const text=(id,value)=>document.getElementById(id).setAttribute('text',value);function select(book){selected=book;for(const item of books){const row=document.getElementById('row-'+item.id);row.setAttribute('container-color',item.id===book.id?'var(--fill-semilight-alpha)':'var(--fill-light-alpha)');row.setAttribute('aria-selected',String(item.id===book.id));}document.getElementById('detail-cover').src='assets/'+book.id+'.svg';document.getElementById('detail-cover').alt=book.title+' cover';text('detail-name',book.title);text('detail-author',book.author+' · '+book.tag);text('detail-label','Overview');text('detail-description',book.description);text('read','Start Preview');detail.removeAttribute('hidden');}for(const book of books){const row=document.getElementById('row-'+book.id);row.addEventListener('click-action',()=>select(book));row.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();select(book);}});}document.getElementById('close-detail').addEventListener('click-action',()=>{detail.setAttribute('hidden','');for(const book of books){const row=document.getElementById('row-'+book.id);row.removeAttribute('container-color');row.setAttribute('aria-selected','false');}document.getElementById('row-'+selected.id).focus();});document.getElementById('save').addEventListener('click-action',()=>{saved=!saved;text('save',saved?'Saved':'Save List');});document.getElementById('read').addEventListener('click-action',()=>{if(!selected)return;const reading=document.getElementById('read').getAttribute('text')==='Back to Overview';text('detail-label',reading?'Overview':'Preview Excerpt');text('detail-description',reading?selected.description:selected.excerpt);text('read',reading?'Start Preview':'Back to Overview');});});</script></body></html>
