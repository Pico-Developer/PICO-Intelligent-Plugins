<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>AlertDialog · Design reference</title><link rel="stylesheet" href="../../runtime/tokens.css"><link rel="stylesheet" href="../../runtime/preview.css"><script src="../../runtime/components.js" defer></script><meta charset="utf-8"></head><body><nav class="preview-nav"><a href="../../index.html">All components</a><span>AlertDialog</span><a href="README.md">Guidelines</a></nav><header class="preview-intro"><h1>AlertDialog</h1><p>Reference examples · original defaults unless explicitly overridden</p></header><div class="sui-stage"><sui-button id="dlg-t" size="small" text="Show dialog" data-opens="dlg-d"></sui-button><sui-alert-dialog id="dlg-d" icon="ic_delete" title="Delete this item?" message="This cannot be undone." hidden><sui-button slot="buttons" size="regular" text="Cancel" container-color="var(--fill-semilight-alpha)" content-color="var(--label-darkest-alpha)" data-closes></sui-button><sui-button slot="buttons" size="regular" text="Delete" data-closes></sui-button></sui-alert-dialog><div class="sui-row" style="margin-top:16px"><sui-button text="BasicAlertDialog" data-opens="basic-AlertDialog"></sui-button><sui-basic-alert-dialog id="basic-AlertDialog" semantic-label="Replace saved version?" hidden>
  <div class="basic-dialog-content">
    <div class="stack" style="gap:16px">
      <sui-text text="Replace saved version?" text-style="headlineLarge" color="var(--fill-darker-alpha)"></sui-text>
      <sui-text text="A file with this name already exists. Replacing it cannot be undone." text-style="bodyMediumMultiline" color="var(--label-ultradark-alpha)"></sui-text>
    </div>
    <div class="basic-dialog-files">
      <sui-text text="Saved file" text-style="bodyMedium" color="var(--label-semidark-alpha)"></sui-text>
      <div class="basic-file-entry">
        <sui-icon name="ic_document" size="24" aria-hidden="true"></sui-icon>
        <div class="stack" style="min-width:0;gap:4px">
          <sui-text text="Scene notes.pdf" text-style="titleMedium"></sui-text>
          <sui-text id="basic-saved-size" text="2.4 MB" text-style="bodySmall" color="var(--label-semidark-alpha)"></sui-text>
        </div>
      </div>
      <sui-text text="New file" text-style="bodyMedium" color="var(--label-semidark-alpha)"></sui-text>
      <div class="basic-file-entry">
        <sui-icon name="ic_document" size="24" aria-hidden="true"></sui-icon>
        <div class="stack" style="min-width:0;gap:4px">
          <sui-text text="Scene notes.pdf" text-style="titleMedium"></sui-text>
          <sui-text text="2.7 MB" text-style="bodySmall" color="var(--label-semidark-alpha)"></sui-text>
        </div>
      </div>
    </div>
    <div class="actions">
      <sui-button id="basic-cancel" text="Cancel" size="regular" container-color="var(--fill-semilight-alpha)" content-color="var(--label-darkest-alpha)" data-closes></sui-button>
      <sui-button id="basic-replace" text="Replace" size="regular" data-closes></sui-button>
    </div>
  </div>
</sui-basic-alert-dialog></div></div><script>(function(){if(window.__suiWire)return;window.__suiWire=1;
function hide(o){o.setAttribute('hidden','')}
document.addEventListener('click',function(e){var t=e.target.closest('[data-opens]');if(t){var o=document.getElementById(t.dataset.opens);if(o){if(o.hasAttribute('hidden'))o.removeAttribute('hidden');else hide(o)}return}
var c=e.target.closest('[data-closes]');if(c){var p=c.closest('sui-menu,sui-sub-menu,sui-spatial-popup,sui-subwindow,sui-basic-alert-dialog,sui-basic-sheet,sui-date-picker-dialog,sui-alert-dialog,sui-sheet,sui-head-image-sheet,sui-coachmark,sui-image-coachmark,sui-rich-coachmark,sui-simple-coachmark');if(p)hide(p)}
var s=e.target.closest('[data-snack]');if(s)document.getElementById(s.dataset.snack).show('Saved to Library',{action:'Undo'})});
document.addEventListener('dismiss-request',function(e){hide(e.target)});
document.addEventListener('select',function(e){var m=e.target.closest&&e.target.closest('sui-menu');if(m&&!m.hasAttribute('keep-open'))hide(m);var cm=e.target.closest&&e.target.closest('sui-coachmark');if(cm)hide(cm)});
})();</script>
<p id="basic-result" class="status" role="status" style="margin:16px 28px">Saved file: Scene notes.pdf · 2.4 MB</p>
<style>
.basic-dialog-content{width:560px;max-width:calc(100vw - 64px);padding:32px;display:flex;flex-direction:column;gap:24px}
.basic-dialog-files{display:grid;grid-template-columns:88px minmax(0,1fr);align-items:start;gap:16px;padding:16px;border-radius:var(--radius-medium-large);background:var(--fill-light-alpha)}
.basic-file-entry{display:flex;align-items:flex-start;gap:12px;min-width:0}
.basic-file-entry sui-icon{flex:none}
</style>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const result = document.getElementById('basic-result');
  document.getElementById('basic-cancel').addEventListener('click-action', () => {
    result.textContent = 'Replacement canceled. Saved file unchanged.';
  });
  document.getElementById('basic-replace').addEventListener('click-action', () => {
    document.getElementById('basic-saved-size').setAttribute('text', '2.7 MB');
    result.textContent = 'Scene notes.pdf replaced · 2.7 MB';
  });
});
</script></body></html>
