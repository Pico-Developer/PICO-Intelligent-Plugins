<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Link · Design reference</title><link rel="stylesheet" href="../../runtime/tokens.css"><link rel="stylesheet" href="../../runtime/preview.css"><script src="../../runtime/components.js" defer></script><meta charset="utf-8"></head><body><nav class="preview-nav"><a href="../../index.html">All components</a><span>Link</span><a href="README.md">Guidelines</a></nav><header class="preview-intro"><h1>Link</h1><p>Reference examples · original defaults unless explicitly overridden</p></header><div class="sui-stage"><div class="sui-row"><sui-link text="Learn more"></sui-link><sui-link text="Learn more" trailing-icon="arrow_right"></sui-link><sui-link size="max" text="Learn more"></sui-link><sui-link text="Disabled" disabled></sui-link></div></div><script>(function(){if(window.__suiWire)return;window.__suiWire=1;

document.addEventListener('dismiss-request',function(e){hide(e.target)});
document.addEventListener('select',function(e){var m=e.target.closest&&e.target.closest('sui-menu');if(m&&!m.hasAttribute('keep-open'))hide(m);var cm=e.target.closest&&e.target.closest('sui-coachmark');if(cm)hide(cm)});
