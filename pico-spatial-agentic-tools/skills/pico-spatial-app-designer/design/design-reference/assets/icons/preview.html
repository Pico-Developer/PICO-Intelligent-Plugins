const entries=JSON.parse(document.getElementById('catalog-data').textContent),grid=document.getElementById('grid'),query=document.getElementById('query'),category=document.getElementById('category'),tint=document.getElementById('tint');let limit=60;
function render(){const terms=query.value.toLowerCase().trim().split(/\s+/).filter(Boolean),items=entries.filter(e=>(!category.value||e.category===category.value)&&terms.every(t=>[e.id,e.name,e.title,e.recommended_use,...e.keywords].join(' ').toLowerCase().includes(t)));grid.replaceChildren();for(const e of items.slice(0,limit)){const card=document.createElement('article');card.className='icon-card';const icon=document.createElement('sui-icon');icon.setAttribute('name',e.id);icon.setAttribute('size','24');icon.setAttribute('tint',tint.value);const large=icon.cloneNode();large.setAttribute('size','40');card.append(icon,large);const code=document.createElement('code');code.textContent=e.name;card.append(code);const id=document.createElement('small');id.textContent=e.id+' · '+e.category+' · '+e.style;card.append(id);const use=document.createElement('p');use.textContent=e.recommended_use;use.style.fontSize='13px';card.append(use);const a=document.createElement('a');a.href=e.path;a.textContent='SVG resource';card.append(a);if(e.requires_confirmation){const note=document.createElement('small');note.textContent='Check intended meaning against the shape.';card.append(note)}grid.append(card)}document.getElementById('count').textContent=items.length+' matches · showing '+Math.min(items.length,limit);document.getElementById('more').hidden=items.length<=limit;}
query.addEventListener('input',()=>{limit=60;render()});category.addEventListener('change',()=>{limit=60;render()});tint.addEventListener('input',()=>grid.querySelectorAll('sui-icon').forEach(i=>i.setAttribute('tint',tint.value)));document.getElementById('more').addEventListener('click',()=>{limit+=60;render()});render();});</script></body></html>
